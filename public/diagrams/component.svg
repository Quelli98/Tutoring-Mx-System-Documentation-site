size="18" fill="#142f50" font-weight="700" text-anchor="start">Express API</text><text x="421" y="209" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Authentication + profile/role guards</text><text x="421" y="232" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Routes → domain services</text><text x="421" y="255" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Safe HTTP response contract</text><rect x="760" y="130" width="300" height="160" rx="9" fill="#f3f7fb" stroke="#bdccda" stroke-width="1.5"/><text x="776" y="157" font-size="12" fill="#2160cc" font-weight="700" text-anchor="start">«external component»</text><text x="776" y="182" font-size="18" fill="#142f50" font-weight="700" text-anchor="start">Auth0</text><text x="776" y="209" font-size="14" fill="#577086" font-weight="400" text-anchor="start">SPA authentication / access tokens</text><text x="776" y="232" font-size="14" fill="#577086" font-weight="400" text-anchor="start">JWKS token verification</text><text x="776" y="255" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Server-only Management API</text><rect x="405" y="380" width="295" height="125" rx="9" fill="#f3f7fb" stroke="#bdccda" stroke-width="1.5"/><text x="421" y="407" font-size="12" fill="#2160cc" font-weight="700" text-anchor="start">«component»</text><text x="421" y="432" font-size="18" fill="#142f50" font-weight="700" text-anchor="start">Prisma + pg</text><text x="421" y="459" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Queries, constraints, transactions</text><rect x="405" y="600" width="295" height="125" rx="9" fill="#f3f7fb" stroke="#bdccda" stroke-width="1.5"/><text x="421" y="627" font-size="12" fill="#2160cc" font-weight="700" text-anchor="start">«database»</text><text x="421" y="652" font-size="18" fill="#142f50" font-weight="700" text-anchor="start">Neon PostgreSQL</text><text x="421" y="679" font-size="14" fill="#577086" font-weight=