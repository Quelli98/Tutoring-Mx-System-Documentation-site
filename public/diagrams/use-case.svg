<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1045" viewBox="0 0 1100 1045" role="img" aria-label="Use case diagram"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#577086" stroke-width="1.5"/></marker><marker id="triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="white" stroke="#577086"/></marker></defs><rect width="1100" height="1045" fill="white"/><rect width="1100" height="10" fill="#142f50"/><text x="40" y="52" font-size="27" fill="#142f50" font-weight="700" text-anchor="start">Use case diagram</text><text x="40" y="81" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Current use cases are solid; dashed green use cases are Sprint 4 targets. Master specialises Organiser.</text><style>text{font-family:Arial,Helvetica,sans-serif} .edge{fill:none;stroke:#577086;stroke-width:1.7;stroke-linejoin:round}</style><rect x="230" y="130" width="635" height="820" rx="0" fill="white" stroke="#bdccda" stroke-width="1.5"/><text x="250" y="164" font-size="19" fill="#142f50" font-weight="700" text-anchor="start">Tutor MX system boundary</text><circle cx="105" cy="205" r="12" fill="white" stroke="#142f50" stroke-width="2"/><path d="M105 217 L105 256" class="edge"/><path d="M82 232 L128 232" class="edge"/><path d="M83 281 L105 256 L127 281" class="edge"/><text x="105" y="305" font-size="16" fill="#142f50" font-weight="700" text-anchor="middle">Student</text><circle cx="105" cy="540" r="12" fill="white" stroke="#142f50" stroke-width="2"/><path d="M105 552 L105 591" class="edge"/><path d="M82 567 L128 567" class="edge"/><path d="M83 616 L105 591 L127 616" class="edge"/><text x="105" y="640" font-size="16" fill="#142f50" font-weight="700" text-anchor="middle">Tutor</text><circle cx="965" cy="210" r="12" fill="white" stroke="#142f50" stroke-width="2"/><path d="M965 222 L965 261" class="edge"/><path d="M942 237 L988 237" class="edge"/><path d="M943 286 L965 261 L987 286" class="edge"/><text x="965" y="310" font-size="16" fill="#142f50" font-weight="700" text-anchor="middle">Organiser</text><circle cx="965" cy="655" r="12" fill="white" stroke="#142f50" stroke-width="2"/><path d="M965 667 L965 706" class="edge"/><path d="M942 682 L988 682" class="edge"/><path d="M943 731 L965 706 L987 731" class="edge"/><text x="965" y="755" font-size="16" fill="#142f50" font-weight="700" text-anchor="middle">Master Organiser</text><ellipse cx="440" cy="245" rx="175" ry="49" fill="#f3f7fb" stroke="#bdccda" stroke-width="1.5"/><text x="440" y="239" font-size="15" fill="#243c54" font-weight="400" text-anchor="middle">View / volunteer for</text><text x="440" y="261" font-size="15" fill="#243c54" font-weight="400" text-anchor="middle">eligible overflow</text><ellipse cx="440" cy="383" rx="175" ry="62" fill="#eaf6f3" stroke="#147d73" stroke-width="1.5" stroke-dasharray="7 5"/><text x="440" y="366" font-size="15" fill="#243c54" font-weight="400" text-anchor="middle">Maintain own timetable,</text><text x="440" y="388" font-size="15" fill="#243c54" font-weight="400" text-anchor="middle">book mutual tutoring times,</text><text x="440" y="410" font-size="15" fill="#243c54" font-weight="400" text-anchor="middle">request Student sick note</text><ellipse cx="440" cy="565" rx="175" ry="62" fill="#f3f7fb" stroke="#bdccda" stroke-width="1.5"/><text x="440" y="548" font-size="15" fill="#243c54" font-weight="400" text-anchor="middle">Manage Tutor timetable,</text><text x="440" y="570" font-size="15" fill="#243c54" font-weight="400" text-anchor="middle">work logs / timesheets,</text><text x="440" y="592" font-size="15" fill="#243c54" font-weight="400" text-anchor="middle">Tutor excuse</text><ellipse cx="440" cy="748" rx="175" ry="48" fill="#eaf6f3" stroke="#147d73" stroke-width="1.5" stroke-dasharray="7 5"/><text x="440" y="742" font-size="15" fill="#243c54" font-weight="400" text-anchor="middle">Request / respond</text><text x="440" y="764" font-size="15" fill="#243c54" font-weight="400" text-anchor="middle">to Tutor swap</text><ellipse cx="730" cy="240" rx="106" ry="52" fill="#f3f7fb" stroke="#bdccda" stroke-width="1.5"/><text x="730" y="234" font-size="15" fill="#243c54" font-weight="400" text-anchor="middle">Manage staffing,</text><text x="730" y="256" font-size="15" fill="#243c54" font-weight="400" text-anchor="middle">reports / approvals</text><ellipse cx="730" cy="535" rx="106" ry="68" fill="#eaf6f3" stroke="#147d73" stroke-width="1.5" stroke-dasharray="7 5"/><text x="730" y="518" font-size="15" fill="#243c54" font-weight="400" text-anchor="middle">Plan scenarios,</text><text x="730" y="540" font-size="15" fill="#243c54" font-weight="400" text-anchor="middle">audit / restore,</text><text x="730" y="562" font-size="15" fill="#243c54" font-weight="400" text-anchor="middle">review proposals</text><ellipse cx="730" cy="813" rx="108" ry="55" fill="#f3f7fb" stroke="#bdccda" stroke-width="1.5"/><text x="730" y="807" font-size="15" fill="#243c54" font-weight="400" text-anchor="middle">Review lecturer</text><text x="730" y="829" font-size="15" fill="#243c54" font-weight="400" text-anchor="middle">applications</text><path d="M125 250 L265 245" class="edge"/><path d="M125 275 L250 383 L265 383" class="edge"/><path d="M125 585 L265 565" class="edge"/><path d="M125 610 L225 748 L265 748" class="edge"/><path d="M945 250 L836 240" class="edge"/><path d="M945 286 L900 535 L836 535" class="edge"/><path d="M945 700 L895 813 L838 813" class="edge"/><path d="M965 640 L965 326" class="edge" marker-end="url(#triangle)"/><text x="982" y="470" font-size="13" fill="#577086" font-weight="500" text-anchor="start">inherits</text><text x="265" y="895" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Auth0 supports sign-in for all actors (external identity service).</text><text x="265" y="918" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Private timetable labels are not part of mutual-availability results.</text><text x="40" y="1022" font-size="12" fill="#577086" font-weight="400" text-anchor="start">Source: 30 Sep handbook + its referenced source archive. Updated 3 Oct 2026.</text></svg>