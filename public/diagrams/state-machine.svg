<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-label="State machine diagram"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#577086" stroke-width="1.5"/></marker><marker id="triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="white" stroke="#577086"/></marker></defs><rect width="1100" height="780" fill="white"/><rect width="1100" height="10" fill="#142f50"/><text x="40" y="52" font-size="27" fill="#142f50" font-weight="700" text-anchor="start">State machine diagram</text><text x="40" y="81" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Current OrganiserApplication lifecycle. Account/profile effects accompany transitions; the record is retained.</text><style>text{font-family:Arial,Helvetica,sans-serif} .edge{fill:none;stroke:#577086;stroke-width:1.7;stroke-linejoin:round}</style><circle cx="550" cy="138" r="8" fill="#142f50" stroke="#142f50" stroke-width="2"/><rect x="375" y="186" width="350" height="108" rx="9" fill="#f3f7fb" stroke="#bdccda" stroke-width="1.5"/><text x="391" y="213" font-size="18" fill="#142f50" font-weight="700" text-anchor="start">PENDING</text><text x="391" y="240" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Verified lecturer registration</text><text x="391" y="263" font-size="14" fill="#577086" font-weight="400" text-anchor="start">No new Organiser Profile or role</text><path d="M550 146 L550 186" class="edge" marker-end="url(#arrow)"/><text x="567" y="170" font-size="13" fill="#577086" font-weight="500" text-anchor="start">register</text><rect x="80" y="472" width="380" height="145" rx="9" fill="#f3f7fb" stroke="#bdccda" stroke-width="1.5"/><text x="96" y="499" font-size="18" fill="#142f50" font-weight="700" text-anchor="start">REJECTED</text><text x="96" y="526" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Master rejects a pending application</text><text x="96" y="549" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Optional review note / reviewer / time</text><text x="96" y="572" font-size="14" fill="#577086" font-weight="400" text-anchor="start">No applicant Profile created</text><rect x="640" y="472" width="380" height="145" rx="9" fill="#f3f7fb" stroke="#bdccda" stroke-width="1.5"/><text x="656" y="499" font-size="18" fill="#142f50" font-weight="700" text-anchor="start">APPROVED</text><text x="656" y="526" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Master approves pending application</text><text x="656" y="549" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Auth0 ORGANISER grant</text><text x="656" y="572" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Neon Profile + review metadata</text><path d="M420 294 L270 377 L270 472" class="edge" marker-end="url(#arrow)"/><text x="85" y="356" font-size="13" fill="#577086" font-weight="500" text-anchor="start">reject [Master, pending]</text><path d="M680 294 L830 377 L830 472" class="edge" marker-end="url(#arrow)"/><text x="850" y="415" font-size="13" fill="#577086" font-weight="500" text-anchor="start">approve [Master, pending]</text><path d="M375 236 L240 236 L240 162 L415 162 L415 186" class="edge" marker-end="url(#arrow)"/><text x="73" y="133" font-size="13" fill="#577086" font-weight="500" text-anchor="start">repeat registration / same record</text><text x="130" y="685" font-size="16" fill="#243c54" font-weight="400" text-anchor="start">A second decision on a reviewed application is rejected as a conflict (409).</text><text x="130" y="712" font-size="16" fill="#243c54" font-weight="400" text-anchor="start">The source does not define automatic resubmission or reopening of REJECTED applications.</text><text x="40" y="757" font-size="12" fill="#577086" font-weight="400" text-anchor="start">Auth0 provisioning precedes the Neon transaction. Cross-provider failure requires reconciliation; it is not atomic.</text></svg>