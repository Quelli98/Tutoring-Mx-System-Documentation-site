<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1120" viewBox="0 0 1100 1120" role="img" aria-label="Activity diagram"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#577086" stroke-width="1.5"/></marker><marker id="triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="white" stroke="#577086"/></marker></defs><rect width="1100" height="1120" fill="white"/><rect width="1100" height="10" fill="#142f50"/><text x="40" y="52" font-size="27" fill="#142f50" font-weight="700" text-anchor="start">Activity diagram</text><text x="40" y="81" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Sprint 4 target: Student books a mutual free slot. Decision guards and the concurrent refresh are explicit.</text><style>text{font-family:Arial,Helvetica,sans-serif} .edge{fill:none;stroke:#577086;stroke-width:1.7;stroke-linejoin:round}</style><circle cx="390" cy="131" r="8" fill="#142f50" stroke="#142f50" stroke-width="2"/><rect x="220" y="167" width="340" height="72" rx="9" fill="#f3f7fb" stroke="#bdccda" stroke-width="1.5"/><text x="236" y="194" font-size="18" fill="#142f50" font-weight="700" text-anchor="start">Choose Tutor, course and duration</text><path d="M390 139 L390 167" class="edge" marker-end="url(#arrow)"/><rect x="220" y="279" width="340" height="90" rx="9" fill="#f3f7fb" stroke="#bdccda" stroke-width="1.5"/><text x="236" y="306" font-size="18" fill="#142f50" font-weight="700" text-anchor="start">Read mutual availability</text><text x="236" y="333" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Use both schedules, sessions and terms</text><path d="M390 239 L390 279" class="edge" marker-end="url(#arrow)"/><rect x="220" y="410" width="340" height="72" rx="9" fill="#f3f7fb" stroke="#bdccda" stroke-width="1.5"/><text x="236" y="437" font-size="18" fill="#142f50" font-weight="700" text-anchor="start">Select time and confirm</text><path d="M390 369 L390 410" class="edge" marker-end="url(#arrow)"/><rect x="220" y="523" width="340" height="85" rx="9" fill="#f3f7fb" stroke="#bdccda" stroke-width="1.5"/><text x="236" y="550" font-size="18" fill="#142f50" font-weight="700" text-anchor="start">Authenticate + validate + recheck</text><text x="236" y="577" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Server write transaction, fresh busy time</text><path d="M390 482 L390 523" class="edge" marker-end="url(#arrow)"/><path d="M390 647 L493 698 L390 749 L287 698 Z" fill="#edf4ff" stroke="#2160cc" stroke-width="1.5"/><text x="390" y="703" font-size="15" fill="#142f50" font-weight="600" text-anchor="middle">Still allowed &amp; free?</text><path d="M390 608 L390 647" class="edge" marker-end="url(#arrow)"/><rect x="713" y="657" width="300" height="92" rx="9" fill="#f3f7fb" stroke="#bdccda" stroke-width="1.5"/><text x="729" y="684" font-size="18" fill="#142f50" font-weight="700" text-anchor="start">Return safe failure / conflict</text><text x="729" y="711" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Explain, reload and choose again</text><path d="M493 698 L713 698" class="edge" marker-end="url(#arrow)"/><text x="565" y="682" font-size="13" fill="#577086" font-weight="500" text-anchor="start">[no]</text><path d="M863 657 L863 324 L560 324" class="edge" marker-end="url(#arrow)"/><rect x="220" y="796" width="340" height="72" rx="9" fill="#f3f7fb" stroke="#bdccda" stroke-width="1.5"/><text x="236" y="823" font-size="18" fill="#142f50" font-weight="700" text-anchor="start">Commit one confirmed booking</text><path d="M390 749 L390 796" class="edge" marker-end="url(#arrow)"/><text x="405" y="776" font-size="13" fill="#577086" font-weight="500" text-anchor="start">[yes]</text><rect x="225" y="906" width="570" height="7" fill="#142f50"/><path d="M390 868 L390 906" class="edge" marker-end="url(#arrow)"/><rect x="80" y="951" width="320" height="67" rx="9" fill="#f3f7fb" stroke="#bdccda" stroke-width="1.5"/><text x="96" y="978" font-size="18" fill="#142f50" font-weight="700" text-anchor="start">Refresh both calendar projections</text><rect x="590" y="951" width="320" height="67" rx="9" fill="#f3f7fb" stroke="#bdccda" stroke-width="1.5"/><text x="606" y="978" font-size="18" fill="#142f50" font-weight="700" text-anchor="start">Emit de-duplicated notifications</text><path d="M240 913 L240 951" class="edge" marker-end="url(#arrow)"/><path d="M750 913 L750 951" class="edge" marker-end="url(#arrow)"/><rect x="225" y="1041" width="570" height="7" fill="#142f50"/><path d="M240 1018 L240 1041" class="edge" marker-end="url(#arrow)"/><path d="M750 1018 L750 1041" class="edge" marker-end="url(#arrow)"/><circle cx="510" cy="1070" r="10" fill="white" stroke="#142f50" stroke-width="2"/><circle cx="510" cy="1070" r="6" fill="#142f50" stroke="#142f50" stroke-width="2"/><path d="M510 1048 L510 1060" class="edge" marker-end="url(#arrow)"/><text x="40" y="1097" font-size="12" fill="#577086" font-weight="400" text-anchor="start">Target design, handbook pp. 32–38. Recheck at commit: a displayed free slot is not a reservation.</text></svg>