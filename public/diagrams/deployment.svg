<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="925" viewBox="0 0 1100 925" role="img" aria-label="Deployment diagram"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#577086" stroke-width="1.5"/></marker><marker id="triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="white" stroke="#577086"/></marker></defs><rect width="1100" height="925" fill="white"/><rect width="1100" height="10" fill="#142f50"/><text x="40" y="52" font-size="27" fill="#142f50" font-weight="700" text-anchor="start">Deployment diagram</text><text x="40" y="81" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Current hosting topology. The browser executes the frontend; Render executes the backend.</text><style>text{font-family:Arial,Helvetica,sans-serif} .edge{fill:none;stroke:#577086;stroke-width:1.7;stroke-linejoin:round}</style><path d="M55 145 L67 133 L367 133 L367 318 L355 330" class="edge"/><rect x="55" y="145" width="300" height="185" rx="0" fill="#f7f9fc" stroke="#bdccda" stroke-width="1.5"/><path d="M355 145 L367 133" class="edge"/><text x="73" y="172" font-size="12" fill="#2160cc" font-weight="700" text-anchor="start">«device»</text><text x="73" y="201" font-size="19" fill="#142f50" font-weight="700" text-anchor="start">User device / browser</text><text x="73" y="231" font-size="14" fill="#577086" font-weight="400" text-anchor="start">«artifact» React/Vite application</text><text x="73" y="254" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Auth0 client + API helper</text><text x="73" y="277" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Own user session</text><path d="M690 145 L702 133 L1052 133 L1052 318 L1040 330" class="edge"/><rect x="690" y="145" width="350" height="185" rx="0" fill="#f7f9fc" stroke="#bdccda" stroke-width="1.5"/><path d="M1040 145 L1052 133" class="edge"/><text x="708" y="172" font-size="12" fill="#2160cc" font-weight="700" text-anchor="start">«execution environment»</text><text x="708" y="201" font-size="19" fill="#142f50" font-weight="700" text-anchor="start">Cloudflare Pages</text><text x="708" y="231" font-size="14" fill="#577086" font-weight="400" text-anchor="start">«artifact» frontend/dist</text><text x="708" y="254" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Public VITE_* build configuration</text><text x="708" y="277" font-size="14" fill="#577086" font-weight="400" text-anchor="start">tutor-mx.pages.dev</text><path d="M55 425 L67 413 L457 413 L457 598 L445 610" class="edge"/><rect x="55" y="425" width="390" height="185" rx="0" fill="#f7f9fc" stroke="#bdccda" stroke-width="1.5"/><path d="M445 425 L457 413" class="edge"/><text x="73" y="452" font-size="12" fill="#2160cc" font-weight="700" text-anchor="start">«execution environment»</text><text x="73" y="481" font-size="19" fill="#142f50" font-weight="700" text-anchor="start">Render Node runtime</text><text x="73" y="511" font-size="14" fill="#577086" font-weight="400" text-anchor="start">«artifact» Express compiled backend</text><text x="73" y="534" font-size="14" fill="#577086" font-weight="400" text-anchor="start">JWT + role/ownership checks</text><text x="73" y="557" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Prisma/pg + server-only secrets</text><path d="M690 425 L702 413 L1052 413 L1052 568 L1040 580" class="edge"/><rect x="690" y="425" width="350" height="155" rx="0" fill="#f7f9fc" stroke="#bdccda" stroke-width="1.5"/><path d="M1040 425 L1052 413" class="edge"/><text x="708" y="452" font-size="12" fill="#2160cc" font-weight="700" text-anchor="start">«external environment»</text><text x="708" y="481" font-size="19" fill="#142f50" font-weight="700" text-anchor="start">Auth0 tenant</text><text x="708" y="511" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Universal Login / JWKS</text><text x="708" y="534" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Role claims + Management API</text><path d="M55 730 L67 718 L457 718 L457 833 L445 845" class="edge"/><rect x="55" y="730" width="390" height="115" rx="0" fill="#f7f9fc" stroke="#bdccda" stroke-width="1.5"/><path d="M445 730 L457 718" class="edge"/><text x="73" y="757" font-size="12" fill="#2160cc" font-weight="700" text-anchor="start">«database environment»</text><text x="73" y="786" font-size="19" fill="#142f50" font-weight="700" text-anchor="start">Neon PostgreSQL</text><text x="73" y="816" font-size="14" fill="#577086" font-weight="400" text-anchor="start">«artifact» schema + migrated records</text><path d="M690 730 L702 718 L1052 718 L1052 833 L1040 845" class="edge"/><rect x="690" y="730" width="350" height="115" rx="0" fill="#f7f9fc" stroke="#bdccda" stroke-width="1.5"/><path d="M1040 730 L1052 718" class="edge"/><text x="708" y="757" font-size="12" fill="#2160cc" font-weight="700" text-anchor="start">«external environment»</text><text x="708" y="786" font-size="19" fill="#142f50" font-weight="700" text-anchor="start">Nager.Date</text><text x="708" y="816" font-size="14" fill="#577086" font-weight="400" text-anchor="start">«service» public holidays</text><path d="M690 227 L355 227" class="edge" marker-end="url(#arrow)"/><text x="465" y="207" font-size="13" fill="#577086" font-weight="500" text-anchor="start">HTTPS static assets</text><path d="M205 330 L205 425" class="edge" marker-end="url(#arrow)"/><text x="220" y="380" font-size="13" fill="#577086" font-weight="500" text-anchor="start">HTTPS + bearer / JSON</text><path d="M355 290 L550 290 L550 485 L690 485" class="edge" marker-end="url(#arrow)"/><text x="430" y="275" font-size="13" fill="#577086" font-weight="500" text-anchor="start">OIDC sign-in</text><path d="M445 530 L690 530" class="edge" marker-end="url(#arrow)"/><text x="465" y="515" font-size="13" fill="#577086" font-weight="500" text-anchor="start">HTTPS: JWKS / Management</text><path d="M250 610 L250 730" class="edge" marker-end="url(#arrow)"/><text x="265" y="680" font-size="13" fill="#577086" font-weight="500" text-anchor="start">SQL over TLS</text><path d="M445 570 L575 570 L575 785 L690 785" class="edge" marker-end="url(#arrow)"/><text x="585" y="770" font-size="13" fill="#577086" font-weight="500" text-anchor="start">HTTPS</text><text x="40" y="902" font-size="12" fill="#577086" font-weight="400" text-anchor="start">Documentation itself is a separate GitHub Pages deployment. Managed-provider hardware is intentionally abstracted.</text></svg>