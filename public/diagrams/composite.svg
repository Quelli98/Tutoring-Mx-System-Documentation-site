<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="865" viewBox="0 0 1100 865" role="img" aria-label="Composite structure diagram"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#577086" stroke-width="1.5"/></marker><marker id="triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="white" stroke="#577086"/></marker></defs><rect width="1100" height="865" fill="white"/><rect width="1100" height="10" fill="#142f50"/><text x="40" y="52" font-size="27" fill="#142f50" font-weight="700" text-anchor="start">Composite structure diagram</text><text x="40" y="81" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Target shared-scheduling component: ports and internal parts. Existing recurrence infrastructure is reused.</text><style>text{font-family:Arial,Helvetica,sans-serif} .edge{fill:none;stroke:#577086;stroke-width:1.7;stroke-linejoin:round}</style><rect x="60" y="135" width="980" height="615" rx="0" fill="white" stroke="#147d73" stroke-width="1.5" stroke-dasharray="7 5"/><text x="85" y="170" font-size="21" fill="#142f50" font-weight="700" text-anchor="start">«structured component» SharedScheduling : Sprint 4 target</text><rect x="53" y="238" width="14" height="24" rx="0" fill="white" stroke="#147d73" stroke-width="1.5"/><text x="81" y="208" font-size="13" fill="#147d73" font-weight="600" text-anchor="start">availability request</text><rect x="53" y="500" width="14" height="24" rx="0" fill="white" stroke="#147d73" stroke-width="1.5"/><text x="81" y="448" font-size="13" fill="#147d73" font-weight="600" text-anchor="start">booking command</text><rect x="1033" y="335" width="14" height="24" rx="0" fill="white" stroke="#147d73" stroke-width="1.5"/><text x="1028" y="390" font-size="13" fill="#147d73" font-weight="600" text-anchor="end">persistence</text><rect x="1033" y="628" width="14" height="24" rx="0" fill="white" stroke="#147d73" stroke-width="1.5"/><text x="1028" y="666" font-size="13" fill="#147d73" font-weight="600" text-anchor="end">calendar projection</text><rect x="115" y="220" width="250" height="125" rx="9" fill="#f3f7fb" stroke="#bdccda" stroke-width="1.5"/><text x="131" y="247" font-size="12" fill="#2160cc" font-weight="700" text-anchor="start">«part»</text><text x="131" y="272" font-size="18" fill="#142f50" font-weight="700" text-anchor="start">guards : access</text><text x="131" y="299" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Verified identity + own schedule</text><text x="131" y="322" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Role-safe returned fields</text><rect x="440" y="220" width="250" height="125" rx="9" fill="#f3f7fb" stroke="#bdccda" stroke-width="1.5"/><text x="456" y="247" font-size="12" fill="#2160cc" font-weight="700" text-anchor="start">«part»</text><text x="456" y="272" font-size="18" fill="#142f50" font-weight="700" text-anchor="start">busy : intervals</text><text x="456" y="299" font-size="14" fill="#577086" font-weight="400" text-anchor="start">TimeSlot recurrence / terms</text><text x="456" y="322" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Exceptions + sessions</text><rect x="760" y="220" width="235" height="125" rx="9" fill="#eaf6f3" stroke="#147d73" stroke-width="1.5" stroke-dasharray="7 5"/><text x="776" y="247" font-size="12" fill="#147d73" font-weight="700" text-anchor="start">«part»</text><text x="776" y="272" font-size="18" fill="#142f50" font-weight="700" text-anchor="start">gaps : intersection</text><text x="776" y="299" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Student free ∩ Tutor free</text><text x="776" y="322" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Duration + bounded window</text><rect x="115" y="465" width="250" height="150" rx="9" fill="#eaf6f3" stroke="#147d73" stroke-width="1.5" stroke-dasharray="7 5"/><text x="131" y="492" font-size="12" fill="#147d73" font-weight="700" text-anchor="start">«part»</text><text x="131" y="517" font-size="18" fill="#142f50" font-weight="700" text-anchor="start">booking : coordinator</text><text x="131" y="544" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Recheck current free time</text><text x="131" y="567" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Version / duplicate conflict</text><text x="131" y="590" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Confirm or cancel safely</text><rect x="440" y="465" width="250" height="150" rx="9" fill="#eaf6f3" stroke="#147d73" stroke-width="1.5" stroke-dasharray="7 5"/><text x="456" y="492" font-size="12" fill="#147d73" font-weight="700" text-anchor="start">«part»</text><text x="456" y="517" font-size="18" fill="#142f50" font-weight="700" text-anchor="start">store : repository</text><text x="456" y="544" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Existing TimeSlot + Allocation</text><text x="456" y="567" font-size="14" fill="#577086" font-weight="400" text-anchor="start">New TutoringBooking</text><text x="456" y="590" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Transaction boundary</text><rect x="760" y="465" width="235" height="150" rx="9" fill="#eaf6f3" stroke="#147d73" stroke-width="1.5" stroke-dasharray="7 5"/><text x="776" y="492" font-size="12" fill="#147d73" font-weight="700" text-anchor="start">«part»</text><text x="776" y="517" font-size="18" fill="#142f50" font-weight="700" text-anchor="start">views : projections</text><text x="776" y="544" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Same booking on both</text><text x="776" y="567" font-size="14" fill="#577086" font-weight="400" text-anchor="start">Student / Tutor calendars</text><text x="776" y="590" font-size="14" fill="#577086" font-weight="400" text-anchor="start">No private labels leaked</text><path d="M67 250 L115 250" class="edge" marker-end="url(#arrow)"/><path d="M365 283 L440 283" class="edge" marker-end="url(#arrow)"/><path d="M690 283 L760 283" class="edge" marker-end="url(#arrow)"/><path d="M67 512 L115 512" class="edge" marker-end="url(#arrow)"/><path d="M365 540 L440 540" class="edge" marker-end="url(#arrow)"/><path d="M300 465 L300 390 L495 390 L495 345" class="edge" marker-end="url(#arrow)"/><text x="325" y="382" font-size="13" fill="#577086" font-weight="500" text-anchor="start">recheck</text><path d="M690 540 L760 540" class="edge" marker-end="url(#arrow)"/><path d="M995 540 L1015 540 L1015 640 L1033 640" class="edge" marker-end="url(#arrow)"/><path d="M690 578 L720 578 L720 365 L1015 365 L1015 347 L1033 347" class="edge" marker-end="url(#arrow)"/><text x="95" y="695" font-size="15" fill="#243c54" font-weight="400" text-anchor="start">Square ports are boundary interfaces. Connectors show collaboration between named internal parts.</text><text x="95" y="719" font-size="15" fill="#243c54" font-weight="400" text-anchor="start">No StudentTimeSlot table, second recurrence engine or browser-side availability calculation.</text><text x="40" y="842" font-size="12" fill="#577086" font-weight="400" text-anchor="start">Source: 30 Sep handbook + its referenced source archive. Updated 3 Oct 2026.</text></svg>